server {
    listen 80;
    listen [::]:80;
    server_name dbc.whoim.space;
    access_log /var/log/nginx/dbc-guard.access.log;
    error_log /var/log/nginx/dbc-guard.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/dbc-guard/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dbc.whoim.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dbc.whoim.space;
    ssl_certificate /etc/letsencrypt/live/dbc.whoim.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbc.whoim.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DBCGuardTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/dbc-guard.access.log;
    error_log /var/log/nginx/dbc-guard.error.log;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
    }
}
